name: ShellCheck

on:
  push:
    branches:
      - main
      - linux-commands
      - bash-scripting
      - documentation
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -type f -print0 | xargs -0 shellcheck
